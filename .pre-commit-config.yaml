repos:
  - repo: local
    hooks:
      - id: backend-lint
        name: backend lint
        entry: uv run --project apps/api --extra dev ruff check apps/api
        language: system
        types: [python]
        pass_filenames: false
      - id: backend-format-check
        name: backend format check
        entry: uv run --project apps/api --extra dev ruff format --check apps/api
        language: system
        types: [python]
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint
        entry: npm run lint
        language: system
        files: ^(apps/web|packages/api-client)/
        pass_filenames: false
      - id: frontend-format-check
        name: frontend format check
        entry: npm run format:check
        language: system
        files: ^(apps/web|packages/api-client)/
        pass_filenames: false
