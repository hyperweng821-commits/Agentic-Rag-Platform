name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install locked backend
        run: uv sync --extra dev --frozen
      - name: Ruff lint
        run: uv run --extra dev ruff check .
      - name: Ruff format
        run: uv run --extra dev ruff format --check .
      - name: Mypy
        run: uv run --extra dev mypy app
      - name: Pytest
        run: uv run --extra dev pytest
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: apps/api/coverage.xml

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: apps/web/coverage

  e2e:
    name: Frontend smoke E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  containers:
    name: Compose and container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        run: docker compose config --quiet && docker compose -f compose.test.yaml config --quiet
      - name: Build application images
        run: docker compose build api web
      - name: Start backend foundation
        run: docker compose up -d --wait postgres api
      - name: Verify backend health
        run: curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:8000/api/v1/health
      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans
