name: agentic-rag-platform

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentic_rag}
      POSTGRES_USER: ${POSTGRES_USER:-agentic_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic_rag_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  chroma:
    image: chromadb/chroma:1.5.9
    profiles: ["rag"]
    ports:
      - "${CHROMA_EXPOSED_PORT:-8001}:8000"
    volumes:
      - chroma_data:/data
    restart: unless-stopped
    networks: [backend]

  ollama:
    image: ollama/ollama:0.31.1
    profiles: ["rag"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    environment:
      APP_NAME: ${APP_NAME:-agentic-rag-backend}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentic_rag}:${POSTGRES_PASSWORD:-agentic_rag_dev_only}@postgres:5432/${POSTGRES_DB:-agentic_rag}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_HEALTHCHECK_TIMEOUT_SECONDS: ${DATABASE_HEALTHCHECK_TIMEOUT_SECONDS:-2}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}'
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks: [backend, frontend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    profiles: ["frontend"]
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_DEV_API_TARGET: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:5173"
    volumes:
      - ./apps/web:/workspace/apps/web
      - ./packages/api-client:/workspace/packages/api-client
      - web_node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [frontend]

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres_data:
  chroma_data:
  ollama_data:
  api_venv:
  web_node_modules:
